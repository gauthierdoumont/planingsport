<!doctype html>
<!--
  Planning Sport — coach muscu, cardio et mobilité personnalisé, 100 % hors ligne.
  Créé par Gauthier Doumont — v1.0 (octobre 2026)
  HTML + CSS + JavaScript vanilla. Aucune librairie, aucune police web, aucun appel réseau.
-->
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<meta name="author" content="Gauthier Doumont">
<meta name="description" content="Planning Sport : programme muscu, cardio et mobilité personnalisé, hors ligne — créé par Gauthier Doumont">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Planning Sport">
<title>Planning Sport</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<style>
/* Planning Sport — styles. Créé par Gauthier Doumont */
:root{--bg:#0d1117;--s1:#151920;--s2:#1c212a;--s3:#283040;--line:#2a313c;--tx:#eef1f6;--mu:#98a2b3;--ac:#4f8cff;--ac-tx:#04112b;--acs:rgba(79,140,255,.15);--ok:#34d399;--ok-tx:#03140d;--oks:rgba(52,211,153,.13);--warn:#fbbf24;--warns:rgba(251,191,36,.12);--bad:#f87171;--bads:rgba(248,113,113,.12);--r:16px;--nav:64px;color-scheme:dark}
[data-theme=light]{--bg:#f3f4f7;--s1:#ffffff;--s2:#eef0f4;--s3:#dfe3ea;--line:#d8dce4;--tx:#121620;--mu:#5b6474;--ac:#2563eb;--ac-tx:#ffffff;--acs:rgba(37,99,235,.1);--ok:#0c9467;--ok-tx:#ffffff;--oks:rgba(12,148,103,.1);--warn:#b7791f;--warns:rgba(183,121,31,.1);--bad:#d33c3c;--bads:rgba(211,60,60,.08);color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;overflow-x:hidden;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom));min-height:100vh}
button{font:inherit;color:inherit}
.view{max-width:560px;margin:0 auto;padding:16px 16px 28px}
h1{font-size:26px;line-height:1.15;margin:6px 0 2px;letter-spacing:-.01em}
h2{font-size:20px;line-height:1.2;margin:2px 0 4px}
h3{font-size:18px;margin:0 0 8px}
h4{margin:18px 0 8px;color:var(--mu);text-transform:uppercase;letter-spacing:.06em;font-size:12px;font-weight:700}
p{margin:6px 0}
.mu{color:var(--mu)} .sm{font-size:14px} .xs{font-size:12px} .b{font-weight:700} .ac{color:var(--ac)} .okc{color:var(--ok)} .badc{color:var(--bad)}
.num-t{font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ac)}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0}
.card.flat{background:var(--s2)}
.row{display:flex;align-items:center;gap:10px}.sb{justify-content:space-between}.grow{flex:1;min-width:0}.wrap{flex-wrap:wrap}.top{align-items:flex-start}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.stack>*+*{margin-top:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--s2);color:var(--tx);font-weight:650;cursor:pointer;text-decoration:none;user-select:none;text-align:center;line-height:1.2}
.btn:active,.icon-btn:active,.day:active{transform:scale(.97)}
.btn.primary{background:var(--ac);border-color:var(--ac);color:var(--ac-tx)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--ok-tx)}
.btn.danger{background:var(--bads);border-color:var(--bad);color:var(--bad)}
.btn.ghost{background:transparent}
.btn.block{width:100%}.btn.big{min-height:56px;font-size:17px}
.btn[disabled]{opacity:.45;pointer-events:none}
.icon-btn{width:48px;height:48px;min-width:48px;border-radius:12px;border:1px solid var(--line);background:var(--s2);color:var(--tx);display:inline-flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;padding:0}
.icon-btn svg,.btn svg{width:22px;height:22px}
select,input[type=text],input[type=date],textarea{width:100%;min-height:48px;background:var(--s2);color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit}
select{appearance:auto}
textarea{min-height:110px;resize:vertical;line-height:1.4}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:1px}
label.fld{display:block;margin:12px 0}
label.fld>span{display:block;font-size:13px;color:var(--mu);margin-bottom:4px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:4px 12px;border-radius:999px;background:var(--s2);border:1px solid var(--line);font-size:14px}
.chip.on{background:var(--acs);border-color:var(--ac);color:var(--tx)}
.chip.okb{background:var(--oks);border-color:var(--ok)}
.chip.badb{background:var(--bads);border-color:var(--bad)}
label.chip{cursor:pointer;min-height:48px}
label.chip input{width:18px;height:18px;accent-color:var(--ac)}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--s3);color:var(--mu);font-weight:600}
.tag.ok{background:var(--oks);color:var(--ok)}.tag.bad{background:var(--bads);color:var(--bad)}.tag.ac{background:var(--acs);color:var(--ac)}
/* Navigation */
nav#nav{position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--s1);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);z-index:20}
nav#nav button{background:none;border:0;color:var(--mu);font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:48px;cursor:pointer}
nav#nav button.on{color:var(--ac)}
nav#nav svg{width:24px;height:24px}
body.full nav#nav{display:none}
body.full{padding-bottom:0}
/* Accueil */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{min-height:68px;border-radius:12px;border:1px solid var(--line);background:var(--s2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;padding:4px 0;cursor:pointer;min-width:0}
.day .e{font-size:18px;line-height:1}.day .l{font-size:10px;color:var(--mu);font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.day.today{border-color:var(--ac)}.day.sel{background:var(--acs);border-color:var(--ac);box-shadow:0 0 0 1px var(--ac) inset}
.exlist{list-style:none;margin:12px 0 4px;padding:0}
.exlist li{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.exlist li:first-child{border-top:0}
.nb{width:28px;height:28px;border-radius:50%;background:var(--s3);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:none}
.exn{font-weight:650;line-height:1.25}
.banner{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:var(--s1);margin:10px 0;text-align:left;cursor:pointer}
.banner.ac{background:var(--acs);border-color:var(--ac)}
.banner.warn{background:var(--warns);border-color:var(--warn);cursor:default}
details.why{margin-top:10px}
details.why summary{min-height:48px;display:flex;align-items:center;cursor:pointer;color:var(--ac);font-weight:650;list-style:none}
details.why summary::-webkit-details-marker{display:none}
details.why summary::before{content:"▸";margin-right:8px;transition:transform .15s}
details.why[open] summary::before{transform:rotate(90deg)}
details.why ul{margin:4px 0 8px;padding-left:20px;color:var(--mu);font-size:14px}
details.why li{margin:4px 0}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.quick .btn{min-height:64px;flex-direction:column;gap:2px;font-size:14px}
.quick .btn span{font-size:20px}
/* Listes */
.list{list-style:none;margin:0;padding:0}
.li{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:10px 4px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer}
.li:last-child{border-bottom:0}
.li .t{font-weight:650;line-height:1.25}
.li .s{font-size:13px;color:var(--mu)}
.month{margin:18px 0 6px;font-size:13px;color:var(--mu);font-weight:700;text-transform:capitalize}
/* Toggle */
.sw-row{display:flex;align-items:center;gap:12px;min-height:56px;padding:6px 0;border-top:1px solid var(--line);cursor:pointer}
.sw-row:first-of-type{border-top:0}
.sw{position:relative;width:52px;height:32px;flex:none}
.sw input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;width:100%;height:100%}
.sw i{position:absolute;inset:0;border-radius:999px;background:var(--s3);transition:.15s;pointer-events:none}
.sw i::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.15s}
.sw input:checked+i{background:var(--ac)}
.sw input:checked+i::after{transform:translateX(20px)}
.sw input:disabled+i{opacity:.6}
.eq-load{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 0 12px 64px}
.eq-load label{font-size:13px;color:var(--mu);font-weight:600}
.eq-load input{margin-top:4px}
.plan-row{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:center;padding:4px 0}
.plan-row .tp{grid-column:2;font-size:12px;color:var(--ac);margin-top:-2px;font-weight:600}
.goal{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.goal:first-child{border-top:0}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;background:var(--s2);border-radius:12px;padding:4px}
.seg button{min-height:48px;border-radius:9px;border:0;background:none;font-weight:650;cursor:pointer;color:var(--mu)}
.seg button.on{background:var(--s1);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.25)}
/* Feuilles (bottom sheets) */
.sheet-wrap{position:fixed;inset:0;z-index:50}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;transition:opacity .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:90vh;overflow-y:auto;overflow-x:hidden;background:var(--s1);border-radius:22px 22px 0 0;padding:6px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .22s ease;overscroll-behavior:contain}
.sheet-wrap.open .backdrop{opacity:1}
.sheet-wrap.open .sheet{transform:none}
.grab{width:40px;height:4px;border-radius:2px;background:var(--s3);margin:6px auto 14px}
.sheet-h{display:flex;align-items:flex-start;gap:10px;margin-bottom:6px}
.sheet ul.tips{padding-left:20px;margin:6px 0}
.sheet ul.tips li{margin:5px 0}
#toast{position:fixed;left:50%;bottom:calc(var(--nav) + 18px + env(safe-area-inset-bottom));transform:translate(-50%,16px);background:var(--tx);color:var(--bg);padding:12px 16px;border-radius:12px;font-weight:650;opacity:0;pointer-events:none;transition:.2s;z-index:70;width:max-content;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
body.full #toast{bottom:calc(96px + env(safe-area-inset-bottom))}
/* Séance */
.s-top{position:sticky;top:0;z-index:25;background:var(--bg);border-bottom:1px solid var(--line)}
.s-top .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:8px 12px}
.s-top .ttl{flex:1;min-width:0;text-align:center}
.s-top .ttl b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-top .ttl span{font-size:13px;color:var(--mu);font-variant-numeric:tabular-nums}
.s-body{max-width:560px;margin:0 auto;padding:12px 16px calc(120px + env(safe-area-inset-bottom))}
.dots{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px}
.dots button{width:22px;height:22px;border-radius:50%;border:2px solid var(--s3);background:none;padding:0;cursor:pointer;position:relative}
.dots button::before{content:"";position:absolute;inset:-13px}
.dots button.done{background:var(--ok);border-color:var(--ok)}
.dots button.cur{border-color:var(--ac);background:var(--acs)}
.exh{font-size:22px;line-height:1.2;margin:0 0 4px}
.tools{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
.tools .btn{font-size:14px;padding:0 8px}
.last{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--s2);font-size:14px}
.sets{margin-top:6px}
.set-row{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:10px;width:100%;min-height:52px;padding:6px 10px;border-radius:12px;border:1px solid transparent;background:none;text-align:left;cursor:pointer}
.set-row+.set-row{margin-top:4px}
.set-row .k{width:30px;height:30px;border-radius:50%;background:var(--s3);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.set-row .v{font-weight:650;font-variant-numeric:tabular-nums}
.set-row.act{border-color:var(--ac);background:var(--acs)}
.set-row.done .k{background:var(--ok);color:var(--ok-tx)}
.set-row.skip .v{text-decoration:line-through;color:var(--mu)}
.editor{margin-top:12px}
.ed-l{font-size:13px;color:var(--mu);font-weight:650;margin:12px 0 6px}
.stepper{display:grid;grid-template-columns:64px 1fr 64px;gap:8px;align-items:center}
.stepper .icon-btn{width:64px;height:56px;font-size:26px;font-weight:700}
.stepper input{text-align:center;font-size:24px;font-weight:750;min-height:56px;font-variant-numeric:tabular-nums;padding:6px}
.feel{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.feel button{min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--s2);font-weight:650;cursor:pointer}
.feel button.on.f{background:var(--oks);border-color:var(--ok)}
.feel button.on.o{background:var(--acs);border-color:var(--ac)}
.feel button.on.d{background:var(--bads);border-color:var(--bad)}
.sub-tools{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
.sub-tools .btn{font-size:13px;padding:0 6px;min-height:48px}
.s-bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--s1);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.s-bottom .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:56px 1fr 56px;gap:8px;align-items:center}
.s-bottom .icon-btn{width:56px;height:56px}
.rest{max-width:560px;margin:0 auto}
.rest .bar{height:6px;border-radius:3px;background:var(--s3);overflow:hidden;margin-bottom:10px}
.rest .bar i{display:block;height:100%;background:var(--ac);transform-origin:left;transition:transform .25s linear}
.rest .rt{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:center}
.rest .big{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.rest .nx{font-size:13px;color:var(--mu);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rest .btn{padding:0 12px;min-width:56px}
.warm li{list-style:none}
.check{display:flex;align-items:center;gap:12px;min-height:52px;padding:6px 4px;border-bottom:1px solid var(--line);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.check .bx{width:26px;height:26px;border-radius:8px;border:2px solid var(--s3);flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--ok-tx)}
.check.on .bx{background:var(--ok);border-color:var(--ok)}
.check.on .tx{color:var(--mu);text-decoration:line-through}
.timer{font-size:44px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;margin:6px 0}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}
.stat{background:var(--s2);border-radius:12px;padding:12px 6px;text-align:center}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--mu)}
.pr{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.pr:first-child{border-top:0}
.pr .ic{font-size:22px}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--mu);font-size:10px;font-family:inherit}
.empty{text-align:center;padding:28px 12px;color:var(--mu)}
.about-sig{font-size:12px;color:var(--mu);text-align:center;margin-top:18px;opacity:.8}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}
@media (min-width:600px){.view,.s-body{padding-left:24px;padding-right:24px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
nav#nav{grid-template-columns:repeat(5,1fr)}
nav#nav button{font-size:11px}
.banner.ok{background:var(--oks);border-color:var(--ok)}
.day{position:relative}
.day.did::after{content:"";position:absolute;left:30%;right:30%;bottom:4px;height:3px;border-radius:2px;background:var(--ok)}
.day[disabled]{pointer-events:none}
.opt{display:block;width:100%;text-align:left;min-height:56px;padding:10px 14px;margin:8px 0;border-radius:12px;border:1px solid var(--line);background:var(--s2);color:var(--tx);cursor:pointer}
.opt b{display:block}.opt span{font-size:13px;color:var(--mu)}
.opt.on{background:var(--acs);border-color:var(--ac);box-shadow:0 0 0 1px var(--ac) inset}
.obbar{height:6px;border-radius:3px;background:var(--s3);overflow:hidden;margin:10px 0 4px}
.obbar i{display:block;height:100%;background:var(--ac);transition:width .25s}
.ob h1{margin-top:10px}
.cbig{text-align:center;padding:18px 12px;margin:12px 0;border-radius:18px;background:var(--s1);border:1px solid var(--line)}
.cbig.work{background:var(--acs);border-color:var(--ac)}
.cbig.rest,.cbig.easy{background:var(--oks);border-color:var(--ok)}
.cbig .timer{font-size:64px;margin:4px 0 10px}
.seg.sc button{min-height:44px}
.seg.sc button.on{background:var(--ac);color:var(--ac-tx)}
[hidden]{display:none!important}
.goal .icon-btn{width:44px;height:44px;min-width:44px}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav" aria-label="Navigation principale">
  <button data-a="go" data-t="home" aria-label="Accueil"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Accueil</button>
  <button data-a="go" data-t="lib" aria-label="Exercices"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5h11M6.5 17.5h11M3 9v6M21 9v6M5 7v10M19 7v10M12 6.5v11"/></svg>Exercices</button>
  <button data-a="go" data-t="prog" aria-label="Progrès"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18M5 16l4-5 4 3 6-8"/></svg>Progrès</button>
  <button data-a="go" data-t="hist" aria-label="Historique"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Historique</button>
  <button data-a="go" data-t="prof" aria-label="Profil"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Profil</button>
</nav>
<div id="sheet-root"></div>
<div id="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:20px">Active JavaScript pour utiliser l’application.</p></noscript>
<script>
/* ===== Planning Sport — bibliothèque d'exercices. Créé par Gauthier Doumont ===== */
const MUSCLES = {
  pecs: "Pectoraux", dos: "Dos (grand dorsal)", trapezes: "Trapèzes / haut du dos",
  epaules: "Épaules (avant)", epaules_lat: "Épaules (latéral)", epaules_arr: "Épaules (arrière)",

const STORES = ['kv', 'exercises', 'sessions', 'bilans'];

const MIGRATIONS = {
  1(db) {

/* Migrations de contenu (format des données), appliquées au démarrage et à l'import. */
const DATA_MIGRATIONS = {};
const DB = {
  db: null, mem: null,
  open() {
    return new Promise(res => {
      const fallback = () => { this.db = null; this.mem = {}; res(false); };
      let req;
      try { if (!window.indexedDB) return fallback(); req = indexedDB.open(DB_NAME, DB_VERSION); } catch (e) { return fallback(); }
      req.onupgradeneeded = e => { const db = req.result, tx = req.transaction; for (let v = (e.oldVersion || 0) + 1; v <= DB_VERSION; v++) if (MIGRATIONS[v]) MIGRATIONS[v](db, tx); };
      req.onsuccess = () => { this.db = req.result; this.db.onversionchange = () => { this.db.close(); toast('Nouvelle version : recharge l’application'); }; res(true); };
      req.onerror = () => fallback();
      req.onblocked = () => toast('Ferme les autres onglets de l’application');
    });
  },
  _m(st) { return this.mem[st] || (this.mem[st] = new Map()); },
  _key(st) { return st === 'kv' ? 'k' : 'id'; },
  _req(st, mode, fn) {
    return new Promise((res, rej) => {

  else if (ratio < 0.5) { delta = -1; msgs.push(`${st.days} jour(s) d’entraînement sur ${st.planned} prévus : on allège un peu pour reprendre le rythme. Si tu manques de temps, réduis plutôt tes jours disponibles dans le profil.`); }
  else if (ratio >= 0.8 && b.energie >= 4 && b.fatigue <= 2) { delta = 1; msgs.push('Excellente semaine : régulier, en forme et peu fatigué → intensité légèrement augmentée.'); }
  else msgs.push('Semaine correcte : on garde la même intensité.');

  if (lvl >= 2 && +S.profile.niveau < 3) levelUp = true;
  const prev = weighed().filter(x => x.id !== b.id).slice(-1)[0];
  const two = weighed().filter(x => x.ts <= b.ts - 12 * 864e5).slice(-1)[0];
  if (b.poids > 0 && prev) {
    const d = b.poids - prev.poids, weeks = Math.max(1, (b.ts - prev.ts) / (7 * 864e5));
    msgs.push(`Poids : ${d > 0 ? '+' : ''}${fmtNum(d, 1)} kg depuis le dernier bilan (${fmtDate(prev.ts, 'short')}).`);
    const cible = +S.profile.poidsCible;
    if (goalRank('perte') <= 1) {
      if (cible && b.poids <= cible) msgs.push('🎯 Poids cible atteint, bravo ! Pense à mettre à jour tes objectifs dans le profil.');
      else if (-d / weeks > prev.poids * 0.01) { msgs.push('Perte rapide (plus de 1 % par semaine) : mange un peu plus, surtout des protéines, pour préserver tes muscles.'); bonus = Math.max(0, bonus - 10); }
      else if (two && b.poids - two.poids > -0.2) { bonus = Math.min(20, bonus + 10); msgs.push('Poids stable depuis 2 semaines : +10 min de cardio par séance cardio. Vérifie aussi ton alimentation (voir l’onglet Progrès).'); }
      else if (d < 0) msgs.push('Perte régulière : c’est le bon rythme, continue comme ça.');
    }
    if (goalRank('muscle') === 0) {
      if (two && b.poids - two.poids < 0.1) msgs.push('Poids stable depuis 2 semaines : pour prendre du muscle, ajoute environ 200 kcal par jour (une collation).');
      else if (d / weeks > prev.poids * 0.006) msgs.push('Prise de poids rapide : réduis un peu les portions pour limiter la prise de gras.');
    }
  }
  if (levelUp) msgs.push('Tu progresses bien depuis plusieurs semaines : tu peux passer au niveau supérieur.');

}

function weightChart() {
  const pts = weighed().slice(-20); const cible = +S.profile.poidsCible;
  if (pts.length < 2) return `<p class="empty sm">La courbe apparaîtra après ton premier bilan hebdomadaire.</p>`;
  const W = 320, H = 150, L = 34, R = 10, T = 12, B = 24;
  const vals = pts.map(p => p.poids).concat(cible && Math.abs(cible - pts[pts.length - 1].poids) < 15 ? [cible] : []);
  let lo = Math.floor(Math.min(...vals) - 1), hi = Math.ceil(Math.max(...vals) + 1); if (hi - lo < 4) { hi += 2; lo -= 2; }
  const t0 = pts[0].ts, t1 = pts[pts.length - 1].ts || t0 + 1;
  const x = t => L + (W - L - R) * ((t - t0) / Math.max(1, t1 - t0)), y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
  const line = pts.map(p => `${x(p.ts).toFixed(1)},${y(p.poids).toFixed(1)}`).join(' ');
  const ticks = [lo, Math.round((lo + hi) / 2), hi].map(v => `<text x="${L - 6}" y="${y(v) + 3}" text-anchor="end">${v}</text><line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/>`).join('');
  const tgt = cible && cible >= lo && cible <= hi ? `<line x1="${L}" x2="${W - R}" y1="${y(cible)}" y2="${y(cible)}" stroke="var(--ok)" stroke-dasharray="4 4"/><text x="${W - R}" y="${y(cible) - 4}" text-anchor="end" style="fill:var(--ok)">objectif</text>` : '';
  const dots = pts.map((p, i) => `<circle cx="${x(p.ts)}" cy="${y(p.poids)}" r="${i === pts.length - 1 ? 4.5 : 3}" fill="var(--ac)"/>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution du poids">${ticks}${tgt}<polyline points="${line}" fill="none" stroke="var(--ac)" stroke-width="2.5" stroke-linejoin="round"/>${dots}
    <text x="${L}" y="${H - 6}">${fmtDate(t0, 'short')}</text><text x="${W - R}" y="${H - 6}" text-anchor="end">${fmtDate(t1, 'short')}</text></svg>`;
}

async function exportData() {
  const kv = (await DB.getAll('kv')).filter(r => r.k !== 'preview');

  const blob = new Blob([JSON.stringify(out, null, 1)], { type: 'application/json' });
  const name = norm(S.profile.prenom).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `planning-sport-${name ? name + '-' : ''}${ymd(new Date())}.json`;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  S.meta.lastExport = Date.now(); await saveKV('meta');
  toast('Sauvegarde exportée ✔'); render();
}
function migrateExport(j) {
  /* format 1 = format actuel. Les futures versions convertiront ici les anciens fichiers. */
  return j;
}
async function importFile(file) {
  let j;
  try { j = JSON.parse(await file.text()); } catch (e) { toast('Fichier illisible (JSON invalide)'); return; }
  if (!j || j.app !== APP_ID || !j.data) { toast('Ce fichier n’est pas une sauvegarde Planning Sport'); return; }
  if (+j.format > EXPORT_FORMAT) { toast('Sauvegarde créée par une version plus récente de l’app'); return; }
  j = migrateExport(j);
  const n = (j.data.sessions || []).length;
  const ok = await ask('Restaurer cette sauvegarde ?', `Sauvegarde du ${fmtDate(j.exportedAt, 'full')} — ${n} séance(s). Toutes les données actuelles seront remplacées.`, 'Restaurer', true);
  if (!ok) return;
  const kv = (j.data.kv || []).filter(r => r && r.k && r.k !== 'preview');
  const meta = kv.find(r => r.k === 'meta'); if (meta) meta.v = Object.assign({}, meta.v, { lastExport: Date.parse(j.exportedAt) || Date.now() });
  try { await DB.replaceAll({ kv, exercises: j.data.exercises || [], sessions: j.data.sessions || [], bilans: j.data.bilans || [] }); }
  catch (e) { toast('Import annulé : aucune donnée modifiée'); return; }
  S.preview = null; S.rest = null; S.warm = null; S.summary = null;
  await loadAll(); applyTheme(); S.tab = S.profile.done ? 'prof' : 'onboard'; render(); toast('Données restaurées ✔');
}

    openSheet(sheetHead(esc(it.name), '<span class="badc">Douleur</span>') + `
      <div class="card flat" style="border-color:var(--bad)"><b>Douleur dans une articulation (épaule, coude, poignet, genou, dos) ? Arrête cet exercice.</b><p class="sm">Une brûlure musculaire en fin de série est normale. Une douleur vive, pointue ou localisée dans l’articulation ne l’est pas : ne force pas.</p><p class="xs mu">Ce n’est pas un avis médical. Si la douleur persiste ou revient, consulte un médecin ou un kinésithérapeute.</p></div>
      <h4>Alternatives plus douces</h4>${alts.length ? `<div class="list">${alts.map(e => `<button class="li" data-a="doReplaceEx" data-id="${e.id}" data-i="${S.active.cur}"><span class="grow"><span class="t">${esc(e.n)}</span><br><span class="s">${esc(LOADS[e.load])} · ${e.eq.map(eqName).join(', ')}</span></span></button>`).join('')}</div>` : '<p class="mu">Aucune alternative disponible avec ton matériel.</p>'}
      ${zones.length ? `<h4>Éviter cette zone à l’avenir</h4><div class="chips">${zones.map(k => `<button class="chip" data-a="addLim" data-k="${k}" style="min-height:44px">+ ${esc(PAIN_ZONES[k])}</button>`).join('')}</div>` : ''}
      <button class="btn danger block" data-a="painStop" style="margin-top:12px">Arrêter cet exercice</button>`);
  },
  painStop: () => { closeAllSheets(); A.skipEx(); toast('Exercice arrêté. Écoute ton corps.'); },
  restAdd: el => { if (!S.rest) return; S.rest.end += +el.dataset.d * 1000; S.rest.total = Math.max(S.rest.total, Math.ceil((S.rest.end - Date.now()) / 1000)); tick(); },
  restSkip: () => { S.rest = null; renderSession(); },
  finish: async () => {
    const s = S.active; const pending = s.items.reduce((n, it) => n + it.sets.filter(x => !x.done && !x.skipped).length, 0);
    closeAllSheets();
    if (pending > 0 && !(await ask('Terminer la séance ?', `${pending} série(s) non faite(s) seront ignorées.`, 'Terminer'))) return;
    await finishSession();
  },
  abandon: async () => { closeAllSheets(); if (await ask('Abandonner la séance ?', 'Rien ne sera enregistré.', 'Abandonner', true)) { S.active = null; S.rest = null; S.warm = null; await saveActive(); releaseWakeLock(); go('home'); } },
  /* cardio guidé */
  cToggle: () => { const a = S.active; if (a.running) { a.left = Math.max(0, Math.ceil((a.end - Date.now()) / 1000)); a.running = false; } else { a.end = Date.now() + (a.left || a.blocks[a.bi].sec) * 1000; a.running = true; requestWakeLock(); } saveActive(); renderSession(); },
  cGoto: i => { const a = S.active; a.bi = clamp(i, 0, a.blocks.length - 1); a.left = a.blocks[a.bi].sec; if (a.running) a.end = Date.now() + a.left * 1000; saveActive(); renderSession(); },
  cNext: () => { const a = S.active; if (a.bi >= a.blocks.length - 1) { a.running = false; a.phase = 'done'; a.endedAt = Date.now(); saveActive(); renderSession(); return; } A.cGoto(a.bi + 1); },
  cPrev: () => A.cGoto(S.active.bi - 1),
  cJump: el => { closeAllSheets(); A.cGoto(+el.dataset.i); },
  cEnd: () => { closeAllSheets(); const a = S.active; if (a.running) a.left = Math.max(0, Math.ceil((a.end - Date.now()) / 1000)); a.running = false; a.phase = 'done'; a.endedAt = Date.now(); a.early = true; saveActive(); renderSession(); },
  cFeel: el => { S.active.rpe = el.dataset.v; saveActiveSoon(); document.querySelectorAll('[data-a=cFeel]').forEach(b => b.classList.toggle('on', b === el)); },
  cSave: () => finishCardio(),
  /* bibliothèque */
  libToggle: el => { S.libF[el.dataset.f] = !S.libF[el.dataset.f]; render(); },
  openEx: el => { const ex = exById(el.dataset.id); if (!ex) return; if (sheets.length) closeAllSheets(); openSheet(exDetail(ex)); },
  newEx: () => openSheet(exForm(null)),
  editEx: el => { const ex = exById(el.dataset.id); closeAllSheets(); openSheet(exForm(ex)); },
  saveEx: async () => {
    const f = $('#exForm'); const fd = new FormData(f); const id = f.dataset.id;
    const n = String(fd.get('n') || '').trim(); if (!n) { toast('Donne un nom à l’exercice'); return; }
    const eq = fd.getAll('eq'); const lines = k => String(fd.get(k) || '').split('\n').map(x => x.trim()).filter(Boolean);
    const data = { n, m: fd.get('m'), s: fd.getAll('s').filter(x => x !== fd.get('m')), p: fd.get('p'), eq: eq.length ? eq : ['pdc'], lv: +fd.get('lv'), t: fd.get('t'), u: fd.get('u') === '1', load: fd.get('load'), f: fd.getAll('f').join(''), c: lines('c'), e: lines('e') };
    let rec;
    if (!id) rec = Object.assign({ id: 'c_' + uid(), custom: true, hidden: false, a: [] }, data);
    else { const old = S.exRecords.find(r => r.id === id) || { id }; rec = Object.assign({}, old, data); if (exById(id) && exById(id).custom) rec.custom = true; }
    await DB.put('exercises', rec); S.exRecords = await DB.getAll('exercises'); buildLibrary();
    closeAllSheets(); render(); toast(id ? 'Exercice modifié' : 'Exercice ajouté'); openSheet(exDetail(exById(rec.id)));
  },
  hideEx: async el => { const id = el.dataset.id; const old = S.exRecords.find(r => r.id === id) || { id }; const ex = exById(id); const rec = Object.assign({}, old, { hidden: !ex.hidden }); await DB.put('exercises', rec); S.exRecords = await DB.getAll('exercises'); buildLibrary(); closeAllSheets(); render(); toast(rec.hidden ? 'Exercice masqué (ignoré par le générateur)' : 'Exercice réaffiché'); },
  resetEx: async el => { const id = el.dataset.id; const old = S.exRecords.find(r => r.id === id); if (old) { if (old.hidden) await DB.put('exercises', { id, hidden: true }); else await DB.del('exercises', id); } S.exRecords = await DB.getAll('exercises'); buildLibrary(); closeAllSheets(); render(); toast('Version d’origine restaurée'); },
  delEx: async el => { const id = el.dataset.id; closeAllSheets(); if (!(await ask('Supprimer cet exercice ?', 'Il disparaîtra de la bibliothèque. Ton historique reste intact.', 'Supprimer', true))) return; await DB.del('exercises', id); S.exRecords = await DB.getAll('exercises'); buildLibrary(); render(); toast('Exercice supprimé'); },
  /* historique */
  openSess: el => { const s = S.sessions.find(x => x.id === el.dataset.id); if (s) openSheet(sessDetail(s)); },
  delSess: async el => { const id = el.dataset.id; closeAllSheets(); if (!(await ask('Supprimer cette séance ?', 'Elle sera retirée de l’historique (action définitive).', 'Supprimer', true))) return; await DB.del('sessions', id); S.sessions = S.sessions.filter(x => x.id !== id); render(); toast('Séance supprimée'); },
  /* bilan */
  bilan: () => { S.bdraft = { energie: 3, sommeil: 3, fatigue: 3, douleurs: [] }; closeAllSheets(); openSheet(bilanSheet()); },
  bScale: el => { S.bdraft[el.dataset.f] = +el.dataset.v; el.parentNode.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === el)); },
  bPain: el => { const k = el.dataset.k, d = S.bdraft.douleurs; const i = d.indexOf(k); if (i > -1) d.splice(i, 1); else d.push(k); el.classList.toggle('badb', i < 0); },
  saveBilan: async () => {
    const poids = parseNum($('#bPoids').value), D = S.bdraft;
    if (poids && !(poids > 25 && poids < 350)) { toast('Poids invalide'); return; }
    const b = { id: uid(), kind: 'semaine', ts: Date.now(), date: ymd(new Date()), poids: poids || 0, energie: D.energie, sommeil: D.sommeil, fatigue: D.fatigue, douleurs: D.douleurs.slice(), note: $('#bNote').value.trim() };
    b.stats = weekStats(Date.now());
    S.bilans.push(b);
    const ad = computeAdapt(b, b.stats); b.adapt = { delta: ad.delta, lvl: ad.lvl, msgs: ad.msgs, levelUp: ad.levelUp };
    S.adapt = { lvl: ad.lvl, cardioBonus: ad.bonus };
    if (ad.delta < 0 && S.program) { S.program.done = 0; b.adapt.msgs.push('Programme cardio : la semaine en cours est recommencée.'); await saveKV('program'); }
    if (poids) { S.profile.poids = poids; await saveKV('profile'); }
    await DB.put('bilans', b); await saveKV('adapt'); S.preview = null;
    closeAllSheets(); render(); openSheet(bilanResult(b));
  },
  openBilan: el => { const b = S.bilans.find(x => x.id === el.dataset.id); if (b) openSheet(bilanDetail(b)); },
  delBilan: async el => { const id = el.dataset.id; closeAllSheets(); if (!(await ask('Supprimer ce bilan ?', 'Action définitive.', 'Supprimer', true))) return; await DB.del('bilans', id); S.bilans = S.bilans.filter(x => x.id !== id); render(); },
  levelUp: async () => { S.profile.niveau = Math.min(3, +S.profile.niveau + 1); S.adapt.lvl = 0; await saveKV('profile'); await saveKV('adapt'); closeAllSheets(); render(); toast(`Niveau ${LEVELS[S.profile.niveau]} 💪`); },
  addLim: async el => { const k = el.dataset.k; if (!lim(k)) S.profile.limites.push(k); await saveKV('profile'); el.disabled = true; el.textContent = '✓ ' + LIMITS[k].n; toast('Limitation ajoutée : ' + LIMITS[k].n); },
  resetAdapt: async () => { S.adapt = { lvl: 0, cardioBonus: 0 }; await saveKV('adapt'); render(); toast('Intensité normale'); },
  /* programmes */
  programs: () => { closeAllSheets(); openSheet(programSheet()); },
  progStart: async el => { const k = el.dataset.k, P = PROGRAMS[k];
    if ((P.bad || []).some(lim) && !(await ask('Programme déconseillé', P.needs + ' Commencer quand même ?', 'Commencer'))) return;
    if (!S.planning.includes('cardio')) toast('Ajoute au moins un jour « Cardio » dans ta semaine');
    S.program = { key: k, week: 1, done: 0, startedAt: Date.now() }; await saveKV('program'); closeAllSheets(); render(); toast('Programme lancé : ' + P.n); },
  progStop: async () => { closeAllSheets(); if (!(await ask('Arrêter le programme ?', 'Ta progression dans ce programme sera perdue.', 'Arrêter', true))) return; S.program = null; await saveKV('program'); render(); },
  progRepeat: async () => { S.program.done = 0; await saveKV('program'); closeAllSheets(); render(); toast('Semaine recommencée'); },
  /* profil */
  setP: el => { const f = el.dataset.f; S.profile[f] = f === 'niveau' ? +el.dataset.v : el.dataset.v; saveProfile(); reRender(); },
  goal: el => { const i = +el.dataset.i, d = +el.dataset.d, g = S.profile.objectifs; const j = i + d; if (j < 0 || j >= g.length) return; [g[i], g[j]] = [g[j], g[i]]; saveProfile(); reRender(); },
  goalAdd: el => { S.profile.objectifs.push(el.dataset.k); saveProfile(); reRender(); },
  goalDel: el => { if (S.profile.objectifs.length > 1) S.profile.objectifs.splice(+el.dataset.i, 1); saveProfile(); reRender(); },
  dispo: el => { const d = +el.dataset.d; S.profile.dispo[d] = !S.profile.dispo[d]; saveProfile(); if (S.tab === 'onboard') { S.planning = proposePlan(); saveKV('planning'); } reRender(); },
  basketDay: el => { const d = +el.dataset.d, b = S.profile.basketJours, i = b.indexOf(d); if (i > -1) b.splice(i, 1); else b.push(d);
    if (i < 0) S.planning[d] = 'basket'; else if (S.planning[d] === 'basket') S.planning[d] = 'repos';
    saveProfile(); if (S.tab === 'onboard') S.planning = proposePlan(); saveKV('planning'); reRender(); },
  propose: () => { S.planning = proposePlan(); saveKV('planning'); reRender(); toast('Planning proposé ✔ (modifiable jour par jour)'); },
  preset: el => { const p = EQ_PRESETS[el.dataset.k]; EQUIP.forEach(q => { if (!q.fixed) S.equipment[q.k] = Object.assign({}, S.equipment[q.k], { on: p.on.includes(q.k) }); }); saveKV('equipment'); reRender(); toast(p.n + ' ✔ — ajuste ensuite au besoin'); },
  theme: el => { S.profile.theme = el.dataset.v; saveProfile(); applyTheme(); render(); },
  export: () => exportData(),
  about: () => openSheet(aboutSheet()),
  restartOb: () => { closeAllSheets(); S.profile.done = false; S.ob = { step: 1 }; saveProfile(); go('onboard'); },
  /* questionnaire */
  obNext: async () => {
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    const st = OB_STEPS[S.ob.step], err = st.check && st.check(); if (err) { toast(err); return; }
    if (S.ob.step === OB_STEPS.length - 1) return finishOnboarding();
    S.ob.step++;
    if (OB_STEPS[S.ob.step].t === 'Tes limitations' && !S.ob.sugg) { S.ob.sugg = true; if ((age() >= 65 || imc() >= 35) && !lim('s')) { S.profile.limites.push('s'); toast('« Pas de sauts » pré-coché pour protéger tes articulations'); } if (age() >= 75 && !lim('q')) S.profile.limites.push('q'); saveProfile(); }
    if (OB_STEPS[S.ob.step].t === 'Ta semaine' && !S.ob.planned) { S.ob.planned = true; S.planning = proposePlan(); saveKV('planning'); }
    render(); window.scrollTo(0, 0);
  },
  obPrev: () => { if (S.ob.step > 0) { S.ob.step--; render(); window.scrollTo(0, 0); } },
  wipe: async () => { closeAllSheets(); if (!(await ask('Tout effacer ?', 'Profil, séances, bilans, exercices perso : tout sera supprimé. Exporte d’abord si tu veux garder une copie.', 'Tout effacer', true))) return; await DB.replaceAll({ kv: [], exercises: [], sessions: [], bilans: [] }); S.active = null; S.preview = null; S.rest = null; S.summary = null; S.meta = clone(DEFAULTS.meta); await loadAll(); applyTheme(); S.ob = { step: 0 }; go('onboard'); toast('Données effacées'); }
};
const NUM_F = ['taille', 'poids', 'poidsCible', 'naissance'], INT_F = ['niveau', 'duree', 'dureeCardio', 'dureeMob', 'bilanJour'];
const C = {
  homeTpl: el => { S.home.tpl = el.value || null; S.home.csub = null; render(); },
  homeDur: el => { S.home.dur = +el.value; render(); },
  homeCsub: el => { S.home.csub = el.value; render(); },
  libP: el => { S.libF.p = el.value; render(); },
  libM: el => { S.libF.m = el.value; render(); },
  prof: el => { const f = el.dataset.f; let v = el.type === 'checkbox' ? el.checked : el.value;
    if (NUM_F.includes(f)) v = parseNum(v); if (INT_F.includes(f)) v = +v;
    S.profile[f] = v; saveProfile();
    if (f === 'basket' && !v) { S.planning = S.planning.map(t => t === 'basket' ? 'repos' : t); S.profile.basketJours = []; saveKV('planning'); }
    if (['prenom', ...NUM_F].includes(f)) { const l = $('#imcLine'); if (l) l.innerHTML = imcLine(); }
    else { S.home.dur = null; reRender(); } },
  lim: el => { const k = el.dataset.k, L = S.profile.limites, i = L.indexOf(k); if (el.checked && i < 0) L.push(k); if (!el.checked && i > -1) L.splice(i, 1); saveProfile(); reRender(); },
  plan: el => { S.planning[+el.dataset.d] = el.value; saveKV('planning'); reRender(); },
  eqOn: el => { const k = el.dataset.k; S.equipment[k] = Object.assign({}, S.equipment[k], { on: el.checked }); saveKV('equipment'); reRender(); },
  eqVal: el => { const k = el.dataset.k; S.equipment[k] = Object.assign({}, S.equipment[k], { [el.dataset.f]: Math.max(0, parseNum(el.value)) }); saveKV('equipment'); },
  actK: el => { const f = $('#actKmF'); if (f) f.hidden = !(ACTIVITIES[el.value] || {}).dist; I.actCalc(); },
  importFile: el => { const f = el.files && el.files[0]; el.value = ''; if (f) importFile(f); }
};
const I = {
  libQ: el => { S.libF.q = el.value; const l = $('#libList'); if (l) l.innerHTML = libList(); },
  ed: el => { const it = curItem(), st = it && it.sets[it.act]; if (!st) return; const f = el.dataset.f; st[f] = Math.max(0, f === 'kg' ? parseNum(el.value) : Math.round(parseNum(el.value))); st.touched = true; saveActiveSoon(); },
  actCalc: () => { const k = $('#actK') && $('#actK').value, min = parseMin($('#actDur').value), km = parseNum($('#actKm').value), A0 = ACTIVITIES[k] || ACTIVITIES.autre;
    $('#actInfo').textContent = min > 0 ? `${min} min · ~${kcalOf(A0.met, min)} kcal${A0.dist && km > 0 ? ' · allure ' + fmtPace(min * 60 / km) : ''}` : 'Indique la durée'; }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el || el.disabled) return;
  const fn = A[el.dataset.a]; if (!fn) return;
  e.preventDefault();
  Promise.resolve().then(() => fn(el, e)).catch(err => { console.warn(err); toast('Oups : ' + (err && err.message || 'erreur')); });
});
document.addEventListener('change', e => { const el = e.target.closest('[data-c]'); if (el && C[el.dataset.c]) C[el.dataset.c](el, e); });
document.addEventListener('input', e => { const el = e.target.closest('[data-i]'); if (el && I[el.dataset.i]) I[el.dataset.i](el, e); });

/* ---------- Service worker (installation hors ligne) ---------- */
function registerSW() {
  if (!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return;
  const had = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').catch(() => { });
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (had) toast('Mise à jour installée ✔ (active au prochain lancement)'); });
}

/* ---------- Démarrage ---------- */
async function init() {
  S.persistent = await DB.open();
  await loadAll();
  applyTheme();
  if (!S.profile.done) S.tab = 'onboard';
  else if (S.active) { S.tab = 'session'; requestWakeLock(); }
  render();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => { });
  registerSW();
  window.__ready = true;
}
init().catch(err => { console.error(err); $('#app').innerHTML = `<div class="view"><h1>Erreur au démarrage</h1><p class="mu">${esc(err && err.message)}</p></div>`; });
</script>
